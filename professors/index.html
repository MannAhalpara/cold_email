<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F6F3EB;
      --card-bg: #FFFFFF;
      --border-dark: #121212;
      --border-subtle: #E2DBD0;
      --accent-lilac: #B376E6;
      --accent-lilac-dark: #9A54D6;
      --accent-lilac-light: rgba(179, 118, 230, 0.15);
      --text-main: #121212;
      --text-muted: #525252;
      --text-dim: #737373;
      --input-bg: #FFFFFF;
      --danger: #EF4444;
      --radius-pill: 999px;
      --radius-card: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 60px;
    }

    .app-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1.5px solid var(--border-subtle);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-main);
    }

    /* Top Dashboard Split Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    @media (max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left KPI Section */
    .kpi-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .kpi-card-main {
      background: var(--card-bg);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: 4px 4px 0px var(--border-dark);
      transition: all 0.2s ease;
    }

    .kpi-card-main:hover {
      box-shadow: 5px 5px 0px var(--accent-lilac);
    }

    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .kpi-subcard {
      background: var(--card-bg);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: 3px 3px 0px var(--border-dark);
      transition: all 0.2s ease;
    }

    .kpi-subcard:hover {
      box-shadow: 4px 4px 0px var(--accent-lilac);
    }

    .kpi-val-lg {
      font-family: 'Outfit', sans-serif;
      font-size: 42px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 4px;
    }

    .kpi-val-md {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
      margin-bottom: 4px;
    }

    .kpi-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Right Weekly Graph Section */
    .graph-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: 4px 4px 0px var(--border-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .graph-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .today-badge {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1.5px solid var(--border-dark);
      box-shadow: 2px 2px 0px var(--accent-lilac);
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
    }

    .svg-graph-container {
      width: 100%;
      height: 150px;
      position: relative;
    }

    .graph-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 8px;
    }

    .day-lbl {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-align: center;
      width: 32px;
    }

    .day-lbl.today {
      color: var(--text-main);
      font-weight: 800;
      background: var(--accent-lilac-light);
      border-radius: 4px;
      padding: 2px 0;
    }

    /* Navigation Tabs */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      border-bottom: 1.5px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    .tab-group {
      display: flex;
      gap: 12px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border-dark);
      color: var(--text-main);
      padding: 10px 24px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      box-shadow: 3px 3px 0px var(--accent-lilac);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1.5px solid var(--border-dark);
      box-shadow: 3px 3px 0px var(--accent-lilac);
    }

    /* Search & Export bar inside Directory */
    .directory-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
    }

    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-pill);
      padding: 12px 20px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      box-shadow: 3px 3px 0px var(--accent-lilac);
    }

    /* Main Sections */
    .content-section {
      display: none;
      animation: fadeIn 0.25s ease-in-out;
    }

    .content-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glass Panel / Card Form */
    .glass-panel {
      background: var(--card-bg);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-card);
      padding: 32px;
      box-shadow: 4px 4px 0px var(--border-dark);
    }

    .form-header {
      margin-bottom: 24px;
    }

    .form-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
    }

    .form-group-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-main);
      margin: 24px 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group-title::after {
      content: '';
      flex: 1;
      height: 1.5px;
      background: var(--border-subtle);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .field-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .field-label span.req {
      color: var(--danger);
      margin-left: 2px;
    }

    .field-label span.opt {
      color: var(--text-dim);
      font-size: 12px;
      margin-left: 4px;
    }

    .field-input {
      background: var(--input-bg);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .field-input:focus {
      box-shadow: 3px 3px 0px var(--accent-lilac);
    }

    .form-actions {
      margin-top: 32px;
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      padding: 12px 28px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border-dark);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 3px 3px 0px var(--accent-lilac);
    }

    .btn-primary:hover {
      box-shadow: 4px 4px 0px var(--accent-lilac-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 3px 3px 0px var(--border-dark);
    }

    .btn-secondary:hover {
      box-shadow: 4px 4px 0px var(--accent-lilac);
      transform: translateY(-1px);
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .prof-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: 3px 3px 0px var(--border-dark);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .prof-card:hover {
      box-shadow: 5px 5px 0px var(--accent-lilac);
      transform: translateY(-2px);
    }

    .prof-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .prof-name {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .prof-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .badge-tag {
      display: inline-block;
      background: var(--accent-lilac-light);
      color: var(--text-main);
      border: 1.5px solid var(--border-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 12px;
      box-shadow: 2px 2px 0px var(--accent-lilac);
    }

    .links-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1.5px solid var(--border-subtle);
    }

    .link-chip {
      font-size: 12px;
      color: var(--text-main);
      text-decoration: none;
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      box-shadow: 2px 2px 0px var(--accent-lilac);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .link-chip:hover {
      box-shadow: 3px 3px 0px var(--border-dark);
      background: var(--accent-lilac-light);
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1.5px solid var(--border-subtle);
    }

    .action-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      color: var(--text-main);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      border-radius: var(--radius-pill);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-dark);
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      box-shadow: 3px 3px 0px var(--accent-lilac);
    }

    .action-btn.delete:hover {
      background: #FEE2E2;
      color: var(--danger);
      box-shadow: 3px 3px 0px var(--danger);
    }

    /* Toast Notification */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }

    .toast {
      background: var(--card-bg);
      border: 1.5px solid var(--border-dark);
      box-shadow: 4px 4px 0px var(--accent-lilac);
      padding: 14px 20px;
      border-radius: var(--radius-card);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      animation: slideIn 0.3s ease-out;
      min-width: 260px;
    }

    .toast.success { border-left: 6px solid var(--accent-lilac); }
    .toast.error { border-left: 6px solid var(--danger); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <h1 class="brand-title">Professors</h1>
    </header>

    <!-- Top Dashboard Split Grid (KPIs Left, Weekly Graph Right) -->
    <div class="dashboard-grid">
      <!-- Left KPIs -->
      <div class="kpi-container">
        <!-- Top: Total Professors -->
        <div class="kpi-card-main">
          <div class="kpi-val-lg" id="stat-total">0</div>
          <div class="kpi-label">Total Professors</div>
        </div>

        <!-- Bottom: Universities Left | Countries Right -->
        <div class="kpi-row">
          <div class="kpi-subcard">
            <div class="kpi-val-md" id="stat-unis">0</div>
            <div class="kpi-label">Universities</div>
          </div>
          <div class="kpi-subcard">
            <div class="kpi-val-md" id="stat-countries">0</div>
            <div class="kpi-label">Countries</div>
          </div>
        </div>
      </div>

      <!-- Right Weekly Graph -->
      <div class="graph-card">
        <div class="graph-header">
          <div class="graph-title">Weekly Activity</div>
          <div class="today-badge" id="today-name-badge">Today</div>
        </div>

        <div class="svg-graph-container" id="svg-container">
          <!-- Curvy SVG graph rendered via JS -->
        </div>

        <div class="graph-labels" id="graph-day-labels">
          <!-- Day Labels rendered via JS -->
        </div>
      </div>
    </div>

    <!-- Navigation Tabs (Default Active: Add New Professor) -->
    <div class="nav-bar">
      <div class="tab-group">
        <button class="tab-btn active" id="tab-btn-add" onclick="switchTab('add-form')">
          Add New Professor
        </button>
        <button class="tab-btn" id="tab-btn-dir" onclick="switchTab('directory')">
          Professors Directory
        </button>
      </div>
    </div>

    <!-- TAB 1 (DEFAULT ACTIVE): ADD NEW PROFESSOR FORM SECTION -->
    <section id="add-form-section" class="content-section active">
      <div class="glass-panel">
        <div class="form-header">
          <h2 class="form-title" id="form-heading">Add New Professor</h2>
        </div>

        <form id="prof-form" onsubmit="handleFormSubmit(event)">
          <!-- General Info -->
          <div class="form-group-title">Basic Information</div>
          <div class="form-grid">
            <div class="field-wrapper">
              <label class="field-label">Professor Name <span class="req">*</span></label>
              <input type="text" id="professor_name" class="field-input" required placeholder="Full Name">
            </div>
            <div class="field-wrapper">
              <label class="field-label">Email Address <span class="req">*</span></label>
              <input type="email" id="email" class="field-input" required placeholder="email@university.edu">
            </div>
            <div class="field-wrapper">
              <label class="field-label">Designation <span class="opt">(Optional)</span></label>
              <input type="text" id="designation" class="field-input" placeholder="Title / Role">
            </div>
          </div>

          <!-- Academic Info -->
          <div class="form-group-title">Academic Institution</div>
          <div class="form-grid">
            <div class="field-wrapper">
              <label class="field-label">University <span class="req">*</span></label>
              <input type="text" id="university" class="field-input" required placeholder="University Name">
            </div>
            <div class="field-wrapper">
              <label class="field-label">Department <span class="req">*</span></label>
              <input type="text" id="department" class="field-input" required placeholder="Department">
            </div>
            <div class="field-wrapper">
              <label class="field-label">Country <span class="req">*</span></label>
              <input type="text" id="country" class="field-input" required placeholder="Country">
            </div>
          </div>

          <!-- Research & Lab -->
          <div class="form-group-title">Research & Laboratory</div>
          <div class="form-grid">
            <div class="field-wrapper">
              <label class="field-label">Research Area <span class="req">*</span></label>
              <input type="text" id="research_area" class="field-input" required placeholder="Field of Research">
            </div>
            <div class="field-wrapper">
              <label class="field-label">Lab Name <span class="opt">(Optional)</span></label>
              <input type="text" id="lab_name" class="field-input" placeholder="Lab Name">
            </div>
            <div class="field-wrapper">
              <label class="field-label">Lab Website Link <span class="opt">(Optional)</span></label>
              <input type="url" id="lab_link" class="field-input" placeholder="https://...">
            </div>
          </div>

          <!-- Webpages -->
          <div class="form-group-title">Webpages</div>
          <div class="form-grid">
            <div class="field-wrapper">
              <label class="field-label">Webpage 1 <span class="req">*</span></label>
              <input type="url" id="webpage_1" class="field-input" required placeholder="https://...">
            </div>
            <div class="field-wrapper">
              <label class="field-label">Webpage 2 <span class="opt">(Optional)</span></label>
              <input type="url" id="webpage_2" class="field-input" placeholder="https://...">
            </div>
            <div class="field-wrapper">
              <label class="field-label">Webpage 3 <span class="opt">(Optional)</span></label>
              <input type="url" id="webpage_3" class="field-input" placeholder="https://...">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">Save to Database</button>
          </div>
        </form>
      </div>
    </section>

    <!-- TAB 2: DIRECTORY SECTION -->
    <section id="directory-section" class="content-section">
      <div class="directory-controls">
        <div class="search-box">
          <input type="text" id="search-input" class="search-input" placeholder="Search name, university, or research..." oninput="handleSearch()">
        </div>
        <button class="btn btn-secondary" onclick="exportToExcel()">Export Excel</button>
      </div>

      <div id="professors-container" class="cards-grid">
        <!-- Rendered via Javascript -->
      </div>
    </section>
  </div>

  <div id="toast-container"></div>

  <script>
    let professorsList = [];
    let isEditing = false;
    let editTargetId = null;

    document.addEventListener("DOMContentLoaded", () => {
      loadWeeklyStats();
      loadProfessors();
    });

    async function loadWeeklyStats() {
      try {
        const res = await fetch("/api/weekly-stats");
        if (!res.ok) return;
        const data = await res.json();
        
        document.getElementById("today-name-badge").innerText = `Today: ${data.today_name}`;
        renderCurvyGraph(data.days, data.today_index);
      } catch (err) {
        console.error("Failed to load weekly stats", err);
      }
    }

    function renderCurvyGraph(days, todayIndex) {
      const svgContainer = document.getElementById("svg-container");
      const labelsContainer = document.getElementById("graph-day-labels");

      if (!days || days.length === 0) return;

      const width = svgContainer.clientWidth || 400;
      const height = 150;
      const padding = 20;

      const maxCount = Math.max(...days.map(d => d.count), 5);
      const points = days.map((d, i) => {
        const x = padding + (i * (width - 2 * padding) / (days.length - 1));
        const y = height - padding - (d.count / maxCount * (height - 2 * padding));
        return { x, y, count: d.count, isToday: d.is_today, day: d.day };
      });

      // Build smooth cubic bezier curve SVG path
      let dPath = `M ${points[0].x} ${points[0].y}`;
      for (let i = 0; i < points.length - 1; i++) {
        const current = points[i];
        const next = points[i + 1];
        const controlX = (current.x + next.x) / 2;
        dPath += ` C ${controlX} ${current.y}, ${controlX} ${next.y}, ${next.x} ${next.y}`;
      }

      // Closed path for gradient fill underneath
      const fillPath = `${dPath} L ${points[points.length - 1].x} ${height} L ${points[0].x} ${height} Z`;

      let svgHtml = `
        <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="overflow: visible;">
          <defs>
            <linearGradient id="curveGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#B376E6" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#B376E6" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <path d="${fillPath}" fill="url(#curveGradient)" />
          <path d="${dPath}" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round" />
      `;

      // Render points
      points.forEach((p, idx) => {
        const isToday = p.isToday;
        const radius = isToday ? 6 : 4;
        const stroke = "#121212";
        const fill = isToday ? "#B376E6" : "#FFFFFF";

        svgHtml += `
          <circle cx="${p.x}" cy="${p.y}" r="${radius}" fill="${fill}" stroke="${stroke}" stroke-width="${isToday ? 3 : 2}" />
        `;
      });

      svgHtml += `</svg>`;
      svgContainer.innerHTML = svgHtml;

      // Render day labels below
      labelsContainer.innerHTML = days.map((d, i) => `
        <div class="day-lbl ${d.is_today ? 'today' : ''}">${d.day}</div>
      `).join('');
    }

    async function loadProfessors(query = "") {
      try {
        const url = query ? `/api/professors?q=${encodeURIComponent(query)}` : "/api/professors";
        const res = await fetch(url);
        if (!res.ok) throw new Error("Failed to load professors");
        professorsList = await res.json();
        renderProfessors(professorsList);
        updateStats(professorsList);
      } catch (err) {
        showToast("Error loading records: " + err.message, "error");
      }
    }

    function updateStats(list) {
      document.getElementById("stat-total").innerText = list.length;
      const unis = new Set(list.map(p => p.university).filter(Boolean));
      const countries = new Set(list.map(p => p.country).filter(Boolean));

      document.getElementById("stat-unis").innerText = unis.size;
      document.getElementById("stat-countries").innerText = countries.size;
    }

    function renderProfessors(list) {
      const container = document.getElementById("professors-container");
      if (!list || list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No Professors Found</h3>
            <p>Add a new professor or adjust your search query.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="prof-card">
          <div>
            <div class="prof-header">
              <div class="prof-name">${escapeHtml(p.professor_name)}</div>
            </div>

            ${p.research_area ? `<div class="badge-tag">${escapeHtml(p.research_area)}</div>` : ''}

            <div class="prof-meta">
              <div>Email: <strong>${escapeHtml(p.email)}</strong></div>
              ${p.designation ? `<div>Designation: ${escapeHtml(p.designation)}</div>` : ''}
              ${p.university ? `<div>University: ${escapeHtml(p.university)} ${p.country ? `(${escapeHtml(p.country)})` : ''}</div>` : ''}
              ${p.department ? `<div>Department: ${escapeHtml(p.department)}</div>` : ''}
              ${p.lab_name ? `<div>Lab: ${escapeHtml(p.lab_name)}</div>` : ''}
            </div>

            ${(p.lab_link || p.webpage_1 || p.webpage_2 || p.webpage_3) ? `
              <div class="links-group">
                ${p.lab_link ? `<a href="${escapeHtml(p.lab_link)}" target="_blank" class="link-chip">Lab Link</a>` : ''}
                ${p.webpage_1 ? `<a href="${escapeHtml(p.webpage_1)}" target="_blank" class="link-chip">Webpage 1</a>` : ''}
                ${p.webpage_2 ? `<a href="${escapeHtml(p.webpage_2)}" target="_blank" class="link-chip">Webpage 2</a>` : ''}
                ${p.webpage_3 ? `<a href="${escapeHtml(p.webpage_3)}" target="_blank" class="link-chip">Webpage 3</a>` : ''}
              </div>
            ` : ''}
          </div>

          <div class="card-footer">
            <div style="display: flex; gap: 8px;">
              <button class="action-btn" onclick="startEdit('${escapeHtml(p.id)}')">Edit</button>
              <button class="action-btn delete" onclick="deleteProfessor('${escapeHtml(p.id)}')">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Saving...";

      const payload = {
        professor_name: document.getElementById("professor_name").value.trim(),
        email: document.getElementById("email").value.trim(),
        university: document.getElementById("university").value.trim(),
        department: document.getElementById("department").value.trim(),
        country: document.getElementById("country").value.trim(),
        research_area: document.getElementById("research_area").value.trim(),
        webpage_1: document.getElementById("webpage_1").value.trim(),
        designation: document.getElementById("designation").value.trim(),
        lab_name: document.getElementById("lab_name").value.trim(),
        lab_link: document.getElementById("lab_link").value.trim(),
        webpage_2: document.getElementById("webpage_2").value.trim(),
        webpage_3: document.getElementById("webpage_3").value.trim(),
      };

      try {
        let res;
        if (isEditing && editTargetId) {
          res = await fetch(`/api/professors/${editTargetId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } else {
          res = await fetch("/api/professors", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        }

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Server error");

        showToast(isEditing ? "Updated professor successfully" : "Saved to Database successfully", "success");
        resetForm();
        switchTab('directory');
        loadProfessors();
        loadWeeklyStats();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Save to Database";
      }
    }

    async function deleteProfessor(id) {
      if (!confirm(`Are you sure you want to delete professor record '${id}'?`)) return;

      try {
        const res = await fetch(`/api/professors/${id}`, { method: "DELETE" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to delete");

        showToast("Professor deleted successfully", "success");
        loadProfessors();
        loadWeeklyStats();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    function startEdit(id) {
      const prof = professorsList.find(p => p.id === id);
      if (!prof) return;

      isEditing = true;
      editTargetId = id;

      document.getElementById("form-heading").innerText = `Edit Professor`;
      document.getElementById("professor_name").value = prof.professor_name || "";
      document.getElementById("email").value = prof.email || "";
      document.getElementById("university").value = prof.university || "";
      document.getElementById("department").value = prof.department || "";
      document.getElementById("country").value = prof.country || "";
      document.getElementById("research_area").value = prof.research_area || "";
      document.getElementById("webpage_1").value = prof.webpage_1 || "";

      document.getElementById("designation").value = prof.designation || "";
      document.getElementById("lab_name").value = prof.lab_name || "";
      document.getElementById("lab_link").value = prof.lab_link || "";
      document.getElementById("webpage_2").value = prof.webpage_2 || "";
      document.getElementById("webpage_3").value = prof.webpage_3 || "";

      document.getElementById("submit-btn").innerText = "Save to Database";
      switchTab("add-form");
    }

    function resetForm() {
      isEditing = false;
      editTargetId = null;
      document.getElementById("form-heading").innerText = "Add New Professor";
      document.getElementById("prof-form").reset();
      document.getElementById("submit-btn").innerText = "Save to Database";
    }

    function switchTab(tabId) {
      document.getElementById("tab-btn-add").classList.remove("active");
      document.getElementById("tab-btn-dir").classList.remove("active");

      document.getElementById("add-form-section").classList.remove("active");
      document.getElementById("directory-section").classList.remove("active");

      if (tabId === 'directory') {
        document.getElementById("tab-btn-dir").classList.add("active");
        document.getElementById("directory-section").classList.add("active");
      } else {
        document.getElementById("tab-btn-add").classList.add("active");
        document.getElementById("add-form-section").classList.add("active");
      }
    }

    function handleSearch() {
      const q = document.getElementById("search-input").value;
      loadProfessors(q);
    }

    function exportToExcel() {
      window.location.href = "/api/professors/export";
    }

    function showToast(msg, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 4000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
